<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plot Finder — by Since Labs</title>
<style>
  :root { --bg:#1a1917; --card:#232120; --line:#38352f; --txt:#f0ede8; --dim:#98938c;
          --accent:#e8e4dd; --accent-hi:#e07a38; --green:#6fb292; --red:#ff383c; --amber:#e8e4dd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; }
  header { padding:28px 32px 16px; border-bottom:1px solid var(--line); }
  .brand{display:flex;align-items:center;gap:10px}
.mark{color:#d4702f;font-weight:800;font-style:italic;font-size:1.15em;letter-spacing:-1px}
.wm{color:#fff;font-weight:700;font-size:1.15rem;letter-spacing:.2px}
  .brand .sep { color:var(--line); }
  h1 { font-size:22px; font-weight:600; font-family:'Lora',Georgia,serif; margin-top:6px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .toolbar { display:flex; gap:12px; align-items:center; padding:16px 32px; flex-wrap:wrap; }
  .search { flex:1; min-width:260px; position:relative; }
  .search input { width:100%; padding:10px 14px 10px 38px; background:var(--card); border:1px solid var(--line);
    border-radius:8px; color:var(--txt); font-size:14px; outline:none; }
  .search input:focus { border-color:var(--accent); }
  .search svg { position:absolute; left:12px; top:11px; width:16px; height:16px; stroke:var(--dim); fill:none; stroke-width:2; }
  .filters { display:flex; gap:8px; }
  .chip { padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); font-size:13px; cursor:pointer; user-select:none; }
  .chip.on { border-color:var(--accent); color:var(--txt); background:rgba(212,112,47,.18); }
  .stats { padding:0 32px 8px; color:var(--dim); font-size:13px; }
  .stats b { color:var(--green); }
  main { padding:8px 32px 48px; display:grid; gap:14px; max-width:1000px; margin:0 auto; }
  .hit { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  .hit.top { border-left:3px solid var(--green); }
  .hit.ctx { border-left:3px solid var(--amber); opacity:.85; }
  .hit.exc { border-left:3px solid var(--red); opacity:.6; }
  .hit-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .kaava { font-size:17px; font-weight:600; }
  .kaava small { color:var(--dim); font-weight:400; margin-left:8px; }
  .badge { font-size:11px; padding:3px 10px; border-radius:12px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
  .b-candidate { background:rgba(34,197,94,.15); color:var(--green); }
  .b-context { background:rgba(245,158,11,.15); color:var(--amber); }
  .b-excluded { background:rgba(239,68,68,.15); color:var(--red); }
  .b-missing_doc { background:#facc15; color:#111; font-weight:600; }
  .kws { margin:8px 0; display:flex; gap:6px; flex-wrap:wrap; }
  .kw { font-size:12px; background:rgba(212,112,47,.14); color:#eda675; padding:2px 10px; border-radius:10px; }
  .keyinfo { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin:12px 0; }
  .ki { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .ki .lab { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:3px; }
  .ki .val { font-size:13px; color:var(--txt); }
  .ki .val.g { color:var(--green); font-weight:600; }
  .ki .val.c { color:var(--amber); font-weight:600; }
  .ki .val.x { color:var(--dim); }
  .ki .val.none { color:var(--dim); font-style:italic; opacity:.7; }
  blockquote { margin:10px 0; padding:12px 16px; background:rgba(255,255,255,.03); border-left:2px solid var(--line);
    font-size:14px; line-height:1.6; color:#cdd7ea; font-style:italic; border-radius:0 8px 8px 0; }
  mark { background:rgba(212,112,47,.35); color:var(--txt); padding:0 2px; border-radius:2px; }
  .links { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .links a { color:var(--accent); font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .links a:hover { text-decoration:underline; }
  .empty { text-align:center; color:var(--dim); padding:60px 0; }
  .tabbar { display:flex; gap:4px; margin-left:8px; }
  .tab { padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:13px; cursor:pointer; }
  .tab.on { color:var(--txt); border-color:#55524b; background:#2b2926; }
  #mapview { padding:0 32px 48px; }
  #map { height:640px; max-width:1000px; margin:0 auto; border:1px solid var(--line); border-radius:12px; background:#141311; }
  .leaflet-popup-content { font-family:'DM Sans',sans-serif; font-size:13px; }
  .pop-title { font-weight:700; margin-bottom:4px; }
  .pop-links a { color:#c2571d; display:block; text-decoration:none; margin-top:2px; }
  .plot-label { font-size:11px; color:var(--dim); background:rgba(212,112,47,.12); padding:2px 8px; border-radius:8px; display:inline-block; margin-top:6px; }
  .bld-chip { font-size:11px; color:#9fb6cc; background:rgba(96,125,155,.14); border:1px solid rgba(96,125,155,.35); padding:2px 10px; border-radius:8px; display:inline-block; margin-top:6px; margin-right:6px; }
  footer { text-align:center; color:var(--dim); font-size:12px; padding:20px; border-top:1px solid var(--line); }
  footer b { color:var(--accent); font-weight:600; }
  .osm-dark { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">//</span><span class="wm">Since Labs</span></div>
  <h1>Plot Finder</h1>
  <div class="sub">Zoning plans with service-housing (palveluasuminen / erityisryhmien asuminen) permission clauses</div>
</header>
<div class="toolbar">
  <select id="city" style="background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:inherit">
    <option value="kirkkonummi">Kirkkonummi</option>
    <option value="espoo">Espoo</option>
    <option value="all">All municipalities</option>
  </select>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Search kaava number, name, keyword or quote…">
  </div>
  <div class="filters">
    <div class="chip on" data-f="candidate">Candidate plots</div>
    <div class="chip" data-f="context">Context</div>
    <div class="chip" data-f="excluded">Excluded</div>
    <div class="chip" data-f="missing_doc">No document</div>
  </div>
  <select id="sortBy" style="background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:inherit">
    <option value="score">Mahdollisuuspisteet (korkein ensin)</option>
    <option value="kaava">Kaava-numero</option>
  </select>
  <div class="tabbar">
    <button class="tab on" data-t="list">Hits</button>
    <button class="tab" data-t="map">Kartta</button>
  </div>
</div>
<div id="bldPanelMount"></div>
<div class="stats" id="stats"></div>
<main id="list"></main>
<div id="mapview" style="display:none"><div id="map"></div></div>
<!-- Leaflet pinned version, no SRI: integrity hash unpinned upstream; acceptable for demo -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="plots.js"></script>
<footer>Since Labs · Plot Finder · data: Kirkkonummi ArcGIS FeatureServer + Espoo Tekla WFS · every hit verifiable via source PDF</footer>
<script>
// NOTE: BUILDINGS must be declared before render()'s first invocation (bldStats reads it) — TDZ otherwise.
let BUILDINGS = [];
// Buildings relevance filters (Antti: flag only buildings that matter for building)
const bldFilters = { minArea: 0, onParcelOnly: false, showAll: false };
const BLD_CHIP_HTML = `
<div id="bldFilters" style="display:none;margin:8px 0;padding:10px 12px;border:1px solid #3a3833;border-radius:8px;background:#211f1c;font-size:12px">
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
    <label style="display:flex;align-items:center;gap:6px;color:#c9c4bd">Min. kerrosala
      <select id="bldMinArea" style="background:#141311;color:#e8e4de;border:1px solid #3a3833;border-radius:6px;padding:2px 6px">
        <option value="0">kaikki</option>
        <option value="100">≥ 100 k-m²</option>
        <option value="300">≥ 300 k-m²</option>
        <option value="1000">≥ 1 000 k-m²</option>
      </select></label>
    <label style="display:flex;align-items:center;gap:6px;color:#c9c4bd">
      <input type="checkbox" id="bldOnParcel"> vain tonteilla (exact plots)</label>
    <label style="display:flex;align-items:center;gap:6px;color:#c9c4bd">
      <input type="checkbox" id="bldShowAll"> näytä kaikki rakennukset</label>
    <span id="bldCount" style="color:#98938c"></span>
  </div>
</div>`;
let show = {candidate:true, context:false, excluded:false, missing_doc:true};
const q = document.getElementById('q');
const citySel = document.getElementById('city');
// fetch buildings immediately so the list view chips work without opening the map
fetch('buildings_data.json', {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { BUILDINGS = d; render(); })
  .catch(e => console.warn('buildings_data.json unavailable:', e));
function currentCity() { return citySel.value; }
function render() {
  const term = q.value.toLowerCase();
  const city = currentCity();
  const hits = DATA.filter(h => show[h.class] !== false)
    .filter(h => city === 'all' || h.city === city)
    .filter(h => !term || (h.kaava+' '+h.nimi+' '+h.keywords.join(' ')+' '+h.quote).toLowerCase().includes(term));
  const sortBy = (document.getElementById('sortBy')||{}).value || 'score';
  hits.sort((a,b) => sortBy === 'score'
    ? (b.score||0) - (a.score||0) || String(a.kaava).localeCompare(String(b.kaava))
    : String(a.kaava).localeCompare(String(b.kaava)));
  const nCand = hits.filter(h=>h.class==='candidate').length;
  const scan = city==='kirkkonummi' ? '142 plan PDFs scanned · 29 text-readable'
             : city==='espoo' ? '1,842 plan PDFs scanned · 1,371 text-readable'
             : '1,984 plan PDFs scanned across 2 municipalities';
  document.getElementById('stats').innerHTML =
    `${hits.length} shown · <b>${nCand} candidate plots</b> · ${scan}`;
  document.getElementById('list').innerHTML = hits.length ? hits.map(h => `
    <div class="hit ${h.class==='candidate'?'top':h.class}">
      <div class="hit-head">
        <div class="kaava">Kaava ${h.kaava}<small>${h.nimi}</small></div>
        ${(h.score!=null&&h.class==='candidate')?`<span class="badge b-candidate" style="background:${h.score>=60?'#1f3d2b':(h.score>=35?'#3d331f':'#3d2222')};color:${h.score>=60?'#7ddf9a':(h.score>=35?'#e8c96a':'#e08a8a')}">⬤ ${h.score} · ${h.verdict}</span>`:''}
        <span class="badge b-${h.class}">${h.class}</span>
      </div>
      <div class="kws">${h.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}</div>
      ${(typeof PLOTS!=='undefined'&&PLOTS&&h.plots&&h.plots.length)?`<div class="plot-label">📍 Exact plots resolved: ${(PLOTS.filter(p=>h.plots.some(q=>{const m=q.match(/kortteli\s+(\d+)\s*\/\s*tontti\s+(\d+)/); return m && p.kortteli===+m[1] && p.tontti===+m[2];})).map(p=>p.label).join(', ')||h.plots.join(', '))}</div>`:''}
      ${bldChip(h)}
      ${h.class==='missing_doc'&&h.note?`<div class="plot-label" style="color:#facc15">⚠</div><div class="plot-label">${h.note}</div>`:''}
      ${keyinfo(h)}
      <blockquote>${hl(h.quote, term)}</blockquote>
      ${h.class==='candidate'?`<button class="chip" style="display:inline-block;margin:8px 8px 0 0" onclick='openReport(${JSON.stringify(h).replace(/'/g,"&#39;")})'>📊 Raportti</button>`:''}
      <div class="links">
        ${h.pdf_url?`<a href="${h.pdf_url}" target="_blank">📄 Source PDF — ${h.pdf_name||''}</a>`:''}
        <a href="${h.map_url || (h.city==='espoo' ? 'https://kartat.espoo.fi/decimen/' : 'https://web.dmcity.fi/kirkkonummi/public/')}" target="_blank">🗺 Municipality kaavoitus page</a>
      </div>
    </div>`).join('') : '<div class="empty">No matches.</div>';
}
function keyinfo(h) {
  const ki = h.key_info || {};
  const cells = [];
  if (ki.permission) {
    const cls = ki.permission==='granted' ? 'g' : (ki.permission==='proportional cap' ? 'c' : 'x');
    cells.push(`<div class="ki"><div class="lab">Permission</div><div class="val ${cls}">${ki.permission}</div></div>`);
  }
  if (ki.plots && ki.plots.length) {
    cells.push(`<div class="ki"><div class="lab">Named plots</div><div class="val">${ki.plots.join('<br>')}</div></div>`);
  } else if (typeof PLOTS!=='undefined' && PLOTS.some(p=>p.kaava===h.kaava)) {
    const ps = PLOTS.filter(p=>p.kaava===h.kaava);
    cells.push(`<div class="ki"><div class="lab">Named plots</div><div class="val">kortteli-level permission — ${ps.length} parcels in zone on map (${ps[0].label}…)</div></div>`);
  }
  cells.push(`<div class="ki"><div class="lab">Building rights</div><div class="val ${ki.building_rights?'':'none'}">${ki.building_rights||'not stated in clause'}</div></div>`);
  if (ki.operator_clause) {
    cells.push(`<div class="ki"><div class="lab">Operator clause</div><div class="val c">present — check terms</div></div>`);
  }
  return cells.length ? `<div class="keyinfo">${cells.join('')}</div>` : '';
}
function hl(text, term) {
  let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  if (!term) return t;
  return t.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>');
}
function bldStats(kaava) {
  if (typeof BUILDINGS === 'undefined') return null;
  const bs = applyBldFilters(BUILDINGS.filter(b => b.kaava === String(kaava)));
  if (!bs.length) return null;
  return { count: bs.length,
           kerrosala: bs.reduce((s,b)=>s+(b.kerrosala||0),0),
           maxfloors: Math.max(0,...bs.map(b=>b.floors||0)),
           apartments: bs.reduce((s,b)=>s+(b.apartments||0),0) };
}
// point-in-polygon (ray casting) for parcel containment checks
function ptInRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = true;
  }
  return inside;
}
function bldCentroid(ring) {
  const n = ring.length; if (!n) return null;
  let x = 0, y = 0; ring.forEach(p => { x += p[0]; y += p[1]; });
  return [x/n, y/n];
}
// apply relevance filters to a building list.
// Default (no explicit user filter): show only RELEVANT buildings — significant
// (>=1000 k-m2 or >=3 floors) or sitting on an exact candidate parcel. Small
// occupied houses are noise for Hoivatilat and hidden unless user widens.
function applyBldFilters(bs) {
  const onParcel = bldFilters.onParcelOnly && typeof PLOTS !== 'undefined' && PLOTS.length;
  const widened = bldFilters.minArea > 0 || bldFilters.showAll;
  return bs.filter(b => {
    if (bldFilters.minArea && (b.kerrosala||0) < bldFilters.minArea) return false;
    if (!widened && b.relevant === false) return false;
    if (!onParcel) return true;
    const c = bldCentroid(b.ring || []);
    if (!c) return false;
    return PLOTS.some(pl => pl.ring && ptInRing(c[0], c[1], pl.ring));
  });
}
function updateBldPanel() {
  const el = document.getElementById('bldCount');
  if (el) el.textContent = `${applyBldFilters(BUILDINGS).length} / ${BUILDINGS.length} buildings shown`;
}

function bldChip(h) {
  const s = bldStats(h.kaava);
  if (!s) return '';
  return `<span class="bld-chip">🏗 ${s.count} existing building${s.count>1?'s':''} · ${s.kerrosala.toLocaleString('fi-FI')} k-m² floor area${s.maxfloors?` · up to ${s.maxfloors} floors`:''}${s.apartments?` · ${s.apartments} apartments`:''} — demolition may be required</span>`;
}

function parseAllowed(h) {
  const texts = [h.quote||'', (h.key_info&&h.key_info.building_rights)||''].join(' ');
  const t = texts.replace(/\s+/g,' ');
  const nums = [];
  // (1) plan-total: "enintään N k-m2" style
  let re = /(enintään|max\.|korkeintaan)?\s*([\d\s]{1,12})\s*(?:k-m2|k-m²|kerrosneliömetri)/gi;
  let m;
  while ((m = re.exec(t)) !== null) {
    const n = parseInt(m[2].replace(/\s/g,''), 10);
    if (n > 0 && n < 1000000) nums.push({n, capped: !!m[1], kind: 'total'});
  }
  if (nums.length) return nums;
  // (2) per-unit rights table: "N ap./M k-m2" -> M is per unit; units unclear, use M*N if both parse
  re = /(\d+)\s*ap\.?\s*\/\s*(\d+)\s*k-m/i;
  m = re.exec(t);
  if (m) {
    const per = parseInt(m[2],10);
    if (per > 0) nums.push({n: per, capped: false, kind: 'per-unit'});
  }
  return nums;
}
function expansion(h) {
  const s = bldStats(h.kaava);
  const allowed = parseAllowed(h);
  if (!allowed.length) return null;
  const a = allowed[0].n;
  return { allowed: a, capped: allowed[0].capped,
           existing: s ? s.kerrosala : 0,
           net: a - (s ? s.kerrosala : 0) };
}
function openReport(h) {
  const s = bldStats(h.kaava), e = expansion(h);
  const fi = n => (n||0).toLocaleString('fi-FI');
  const rows = [];
  rows.push(`<tr><td>Kaava</td><td>${h.kaava} — ${h.nimi||''} (${h.stage||''})</td></tr>`);
  if (h.quote) rows.push(`<tr><td>Lupaclaus</td><td>${h.quote}</td></tr>`);
  if (h.plots && h.plots.length) rows.push(`<tr><td>Nimitetyt tontit</td><td>${h.plots.join(', ')}</td></tr>`);
  if (h.key_info && h.key_info.building_rights) rows.push(`<tr><td>Rakennusoikeus</td><td>${h.key_info.building_rights}</td></tr>`);
  if (s) rows.push(`<tr><td>Olemassa olevat rakennukset</td><td>${s.count} kpl · ${fi(s.kerrosala)} k-m² kerrosalaa${s.maxfloors?` · max ${s.maxfloors} kerrosta`:''}${s.apartments?` · ${s.apartments} asuntoa`:''}</td></tr>`);
  if (e) {
    const verdict = e.net <= 0
      ? `ei selvää lisäpotentiaalia ilman purkuja (rajoite koskee erityisryhmien asumista; olemassa oleva kerrosala kattaa kaikki käyttötarkoitukset)`
      : `<b>${fi(e.net)} k-m²</b> (sallittu ${fi(e.allowed)} − olemassa ${fi(e.existing)}) — karkea arvio: olemassa oleva kattaa kaikki käyttötarkoitukset`;
    rows.push(`<tr><td>Laajennuspotentiaali</td><td>${verdict}${e.capped?' · kattolauseke mainittu määräyksessä':''}</td></tr>`);
  }
  rows.push(`<tr><td>Lähteet</td><td>${h.pdf_url?`<a href="${h.pdf_url}">Kaavamääräys-PDF</a>`:'ei julkista asiakirjaa'} · ${h.city==='espoo'?'https://kartat.espoo.fi/decimen/':'https://web.dmcity.fi/kirkkonummi/public/'}</td></tr>`);
  rows.push(`<tr><td>Huomiot</td><td>Laajennusluku on karkeaan vertailuun: olettaa täyden rakennusoikeuden käytön. Purkukustannuksia, suojeluarvoja ja tonttikohtaisia rajoitteita ei ole arvioitu.</td></tr>`);
  const html = `<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8"><title>Kaava ${h.kaava} — Plot Finder -raportti</title>
<style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px;color:#1a1917}
h1{font-size:22px;border-bottom:2px solid #d4702f;padding-bottom:8px}h1 small{color:#666;font-weight:normal}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}td{border-bottom:1px solid #ddd;padding:10px 8px;vertical-align:top}
td:first-child{font-weight:bold;width:220px;color:#555}blockquote{background:#f7f5f2;padding:12px;border-left:3px solid #d4702f;margin:0}
.brand{font-size:12px;color:#999;margin-top:30px}@media print{.noprint{display:none}}</style></head><body>
<h1>Kaava ${h.kaava} — ${h.nimi||''}<br><small>Plot Finder · Since Labs · ${new Date().toLocaleDateString('fi-FI')}</small></h1>
<table>${rows.join('')}</table>
<div class="brand">Since Labs · Plot Finder — generoitu automaattisesti kunnan avoimesta aineistosta</div>
<div class="noprint" style="margin-top:20px"><button onclick="window.print()">Tulosta / PDF</button></div>
</body></html>`;
  window.open('data:text/html;charset=utf-8,'+encodeURIComponent(html), '_blank');
}

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  c.classList.toggle('on'); show[c.dataset.f] = c.classList.contains('on'); render(); refreshMapLayers();
});
// buildings filter panel: inject after DOM ready, show when buildings data arrives
document.getElementById('bldPanelMount').innerHTML = BLD_CHIP_HTML;
document.getElementById('bldMinArea').onchange = e => { bldFilters.minArea = +e.target.value; refreshMapLayers(); render(); };
document.getElementById('bldOnParcel').onchange = e => { bldFilters.onParcelOnly = e.target.checked; refreshMapLayers(); render(); };
document.getElementById('bldShowAll').onchange = e => { bldFilters.showAll = e.target.checked; refreshMapLayers(); render(); };
q.oninput = () => { render(); refreshMapLayers(); }; citySel.onchange = () => { render(); refreshMapLayers(); };
document.getElementById('sortBy').onchange = () => render();
render();

// ---- Map tab ----
let mapInited = false, map, planLayer, plotLayer, bldLayer;
function mapHits() {  // same filter chain as the list view
  const term = q.value.toLowerCase();
  const city = currentCity();
  return DATA.filter(h => show[h.class] !== false)
    .filter(h => city === 'all' || h.city === city)
    .filter(h => !term || (h.kaava+' '+h.nimi+' '+h.keywords.join(' ')+' '+h.quote).toLowerCase().includes(term));
}
function initMap() {
  if (typeof L === 'undefined') {  // htmlpreview/CDN script-blocking fallback: load Leaflet then retry
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = initMap;
    document.head.appendChild(s);
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    return;
  }
  map = L.map('map', {backgroundColor:'#141311'}).setView([60.126, 24.55], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19, className:'osm-dark'}).addTo(map);
  planLayer = L.layerGroup().addTo(map);
  plotLayer = L.layerGroup().addTo(map);
  bldLayer = L.layerGroup().addTo(map);  // on by default: shows only relevance-filtered buildings
  L.control.layers({}, {'Kaava-alueet (candidates)': planLayer, 'Tontit (exact plots)': plotLayer, 'Rakennukset (existing buildings)': bldLayer}, {collapsed:false}).addTo(map);
  // load buildings early with no-store so list chips + map layer both get it
  fetch('buildings_data.json', {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { BUILDINGS = d; render(); })
    .catch(e => console.warn('buildings_data.json unavailable:', e));
  mapInited = true;
  refreshMapLayers();
}
function refreshMapLayers() {
  if (!mapInited) return;
  planLayer.clearLayers();
  plotLayer.clearLayers();
  bldLayer.clearLayers();
  const hits = mapHits();
  const byKaava = {};
  hits.forEach(h => { (byKaava[h.kaava] = byKaava[h.kaava] || []).push(h); });
  const city = currentCity();
  (typeof PLAN_POLYS !== 'undefined' ? PLAN_POLYS : []).forEach(p => {
    if (!p.ring || !byKaava[p.kaava]) return;
    if (city !== 'all' && p.city && p.city !== city) return;
    const hits = byKaava[p.kaava];
    const missing = hits[0].class === 'missing_doc';
    const poly = L.polygon(p.ring.map(pt => [pt[1], pt[0]]), {
      color: missing ? '#facc15' : '#6fb292', weight:2, fillOpacity:0.18}).addTo(planLayer);
    const links = missing
      ? `<div style="margin-top:6px;color:#111;background:#facc15;padding:4px 8px;border-radius:6px;font-weight:600;max-width:260px">⚠ ${hits[0].note || 'Ei julkista kaavamääräysasiakirjaa'}</div>`
      : hits.map(h =>
      `<div class="pop-links"><a href="${h.pdf_url}" target="_blank">📄 Kaavamääräys PDF</a></div>` +
      `<div style="margin-top:6px;color:#98938c;max-width:260px;font-style:italic">"${h.quote.slice(0,140)}…"</div>`).join('');
    poly.bindPopup(`<div class="pop-title">Kaava ${p.kaava} — ${p.name || hits[0].nimi}</div>${links}`);
  });
  (typeof PLOTS !== 'undefined' ? PLOTS : []).forEach(pl => {
    if (!pl.ring) return;
    if (city !== 'all' && pl.city && pl.city !== city) return;
    const poly = L.polygon(pl.ring.map(pt => [pt[1], pt[0]]), {
      color:'#e07a38', weight:3, fillOpacity:0.45}).addTo(plotLayer);
    poly.bindPopup(`<div class="pop-title">Tontti ${pl.label}</div>
      <div>Kiinteistötunnus: ${pl.kiinteistotunnus}</div>
      <div>Pinta-ala: ${pl.area_m2} m²</div>
      ${pl.address ? `<div>Osoite: ${pl.address}</div>` : ''}
      ${pl.kaava ? `<div style="margin-top:4px">Kaava: <a href="#" onclick="switchToHit('${pl.kaava}');return false">${pl.kaava}</a></div>` : ''}
      ${pl.note ? `<div style="margin-top:4px;color:#98938c;font-style:italic;max-width:260px">${pl.note}</div>` : ''}`);
  });
  // existing buildings (blue-gray footprints, only for plans currently shown, relevance-filtered)
  const kaavaSet = new Set(hits.map(h => String(h.kaava)));
  const relevantBlds = applyBldFilters(BUILDINGS.filter(b => kaavaSet.has(b.kaava)));
  relevantBlds.forEach(b => {
    if (!b.ring) return;
    const polys = (b.rings && b.rings.length > 1) ? b.rings : [b.ring];
    const poly = L.polygon(polys.map(r => r.map(pt => [pt[1], pt[0]])), {
      color:'#607d9b', weight:1.5, fillColor:'#607d9b', fillOpacity:0.35}).addTo(bldLayer);
    poly.bindPopup(`<div class="pop-title">Rakennus ${b.address || ''}</div>
      ${b.kerrosala ? `<div>Kerrosala: ${b.kerrosala.toLocaleString('fi-FI')} k-m²</div>` : ''}
      ${b.floors ? `<div>Kerroksia: ${b.floors}</div>` : ''}
      ${b.apartments ? `<div>Huoneistoja: ${b.apartments}</div>` : ''}
      ${b.tilavuus ? `<div>Tilavuus: ${Math.round(b.tilavuus).toLocaleString('fi-FI')} m³</div>` : ''}
      ${b.kokonaisala ? `<div>Kokonaisala: ${b.kokonaisala.toLocaleString('fi-FI')} m²</div>` : ''}
      <div>VTJ-PRT: ${b.vtj_prt || '—'}</div>
      ${b.also_in && b.also_in.length ? `<div>Myös kaavoissa: ${b.also_in.join(', ')}</div>` : ''}
      <div style="margin-top:4px;color:#98938c;font-style:italic">Kaava ${b.kaava} — existing building; demolition required before new construction</div>`);
  });
  updateBldPanel();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const isMap = t.dataset.t === 'map';
  document.getElementById('list').style.display = isMap ? 'none' : '';
  document.getElementById('mapview').style.display = isMap ? '' : 'none';
  if (isMap && !mapInited) initMap();
  if (isMap) setTimeout(() => map.invalidateSize(), 50);
});
function switchToHit(kaava) {
  // switch to list tab and highlight the hit for this kaava
  document.querySelector('.tab[data-t="list"]').click();
  q.value = kaava;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
</body>
</html>
